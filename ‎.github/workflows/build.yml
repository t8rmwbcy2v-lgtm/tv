name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # If your project includes a ./gradlew wrapper, omit gradle-version so it uses your repo's exact version
        with:
          gradle-version: 8.7

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ArchTV.apk

      - name: Keep a copy as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArchTV-APK
          path: ArchTV.apk

      - name: Publish to a public release (easy download link for the TV)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Arch TV (latest build)
          files: ArchTV.apk
